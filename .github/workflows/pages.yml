name: pages

# Static web app to GitHub Pages: https://itsolaph.github.io/outlive/
# The page talks to the public testnet RPC and the FastNEAR transaction index directly,
# so the hosted copy needs no backend of ours.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sdk/**"
      - "package.json"
      - "package-lock.json"
      - "docs/media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w web
      # the demo film and its poster ship with the page, so one link is enough
      - run: mkdir -p web/dist/media && cp docs/media/* web/dist/media/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
