name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NEAR_VERSION: "0.22.0"

jobs:
  contracts:
    name: contracts (wasm build, unit and sandbox tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near from its release
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build wasm (vault, outlive, tusdc)
        run: bash scripts/build.sh
      - name: Contract unit tests
        run: cd contracts && cargo test -p vault -p outlive -p tusdc
      - name: Sandbox integration tests
        run: cd contracts && cargo test -p outlive-tests --test integration -- --test-threads 4

  node:
    name: node tests (Node 22) and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Script syntax
        run: for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
      - name: Deployment evidence tests
        run: node --test scripts/test/*.test.mjs
      - name: sdk, worker and agents tests
        run: npm test
      - name: Web build
        run: npm run build -w web
