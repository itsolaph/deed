name: status

# During the private-repo period we cannot read the Actions API with the
# tokens we hold, so this mirrors each finished `ci` run's conclusion into a
# single status.json on the orphan `ci-status` branch, readable with any
# deploy key: overall conclusion, per-job and per-step results, and the tail
# of each failed job's log. Remove this file when the repo goes public.
# Event fields reach run: only via env:, never interpolated directly.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  report:
    name: mirror ci results to the ci-status branch
    runs-on: ubuntu-latest
    steps:
      - name: Push status.json
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            -o run_jobs.json
          export RUN_JOBS="$PWD/run_jobs.json" RUN_STATUS="$PWD/status.json"
          python3 - <<'PY'
          import json, os, datetime, urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          jobs = json.load(open(os.environ['RUN_JOBS'])).get('jobs', [])

          def logs(job_id):
            # The logs endpoint 302s to a signed Azure URL; following it with
            # the GitHub token in the header makes Azure reject the request,
            # so read the Location and fetch it without credentials.
            req = urllib.request.Request(
              'https://api.github.com/repos/%s/actions/jobs/%s/logs' % (repo, job_id),
              headers={'Authorization': 'token ' + token})

            class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None

            try:
              with urllib.request.build_opener(NoRedirect).open(req, timeout=60) as r:
                return r.read().decode('utf-8', 'replace')
            except urllib.error.HTTPError as e:
              if e.status in (301, 302, 303, 307, 308) and e.headers.get('Location'):
                with urllib.request.urlopen(e.headers['Location'], timeout=120) as r:
                  return r.read().decode('utf-8', 'replace')
              raise

          out_jobs = []
          for j in jobs:
            entry = {'name': j['name'], 'conclusion': j['conclusion'],
                     'steps': [{'name': s['name'], 'conclusion': s['conclusion']}
                               for s in j.get('steps', [])]}
            if j['conclusion'] not in ('success', 'skipped', None):
              try:
                lines = logs(j['id']).splitlines()
                err = [l for l in lines if '##[error]' in l or '::error' in l]
                entry['log_excerpt'] = '\n'.join(err + ['...tail...'] + lines[-60:])[:12000]
              except Exception as e:
                entry['log_excerpt'] = '(log fetch failed: %s)' % e
            out_jobs.append(entry)

          status = {
            'conclusion': os.environ['CONCLUSION'],
            'sha': os.environ['SHA'],
            'run_id': int(os.environ['RUN_ID']),
            'url': os.environ['URL'],
            'at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'jobs': out_jobs,
          }
          open(os.environ['RUN_STATUS'], 'w').write(json.dumps(status, indent=1))
          PY
          mkdir out && cd out
          git init -q
          git config user.name "ci-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-status
          cp "$RUN_STATUS" status.json
          git add status.json
          git commit -qm "ci status: $CONCLUSION for run $RUN_ID"
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" ci-status:ci-status
