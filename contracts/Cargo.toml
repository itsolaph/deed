[workspace]
resolver = "2"
members = ["deed", "vault", "tusdc", "tests"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
